:root{

*{box-sizing:border-box}

<body>

const TZ='Europe/Amsterdam';

const AKEY='uren-archief';
const archGet=()=>{try{return JSON.parse(localStorage.getItem(AKEY)||'{}')}catch(e){return{}}};
const archPut=a=>{try{localStorage.setItem(AKEY,JSON.stringify(a));return true}catch(e){return false}};
const archCount=()=>Object.keys(archGet()).length;
const b64=blob=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(blob)});
const unb64=(s,type)=>{const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type})};
async function archSave(y,m,name,blob){try{const a=archGet();a[`${y}-${pad(m+1)}`]={name,at:Date.now(),data:await b64(blob)};if(!archPut(a))toast('Archief is vol: de Excel is niet bewaard')}catch(e){}}
function openArchive(){
  const a=archGet(),ks=Object.keys(a).sort().reverse();
  const rows=ks.map(k=>{const[y,m]=k.split('-').map(Number),v=a[k];return `<div class="arow"><span class="ar-t"><b>${MAANDEN[m-1][0].toUpperCase()+MAANDEN[m-1].slice(1)} ${y}</b><small>Gemaakt ${fmtAt(v.at)}</small></span><button class="btn" data-ar="${k}">Delen</button></div>`}).join('');
  $('#layer').innerHTML=sheetBack('Archief',`<p class="hint">Elke Excel die je maakt, wordt hier per maand bewaard. Maak je een maand opnieuw, dan wordt de oude versie vervangen.</p>${ks.length?`<div class="alist">${rows}</div>`:'<p class="hint"><b>Nog leeg.</b> Zodra je met Maak Excel een maand verstuurt, staat hij hier.</p>'}`);
  wireBack();
  document.querySelectorAll('[data-ar]').forEach(bt=>bt.onclick=()=>{const v=archGet()[bt.dataset.ar];if(v)offerFile(v.name,unb64(v.data,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'),'Excel gedeeld',v.name.replace('.xlsx','').replace(/_/g,' '))});
}

/*SAVE*/async function offerFile(name,blob,okMsg,text){
  const file=new File([blob],name,{type:blob.type||'application/octet-stream'});
  let can=false;try{can=!!(navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
  const data={files:[file]};if(text)data.text=text;
  const isAndroid=/Android/i.test(navigator.userAgent);
  const download=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},8000);
    $('#layer').innerHTML=`<div class="veil" id="veil"><div class="sheet" role="dialog" aria-label="Bestand opgeslagen"><h2>Bestand opgeslagen</h2><p class="hint">${esc(name)} staat in je map <b>Downloads</b>.</p><ol class="howto"><li>Open je mail-app (bijvoorbeeld Gmail of Outlook) en maak een nieuw bericht.</li><li>Tik op de <b>paperclip</b> om een bijlage toe te voegen.</li><li>Kies het bestand uit <b>Downloads</b> en verstuur.</li></ol><button class="btn" id="shc">Begrepen</button></div></div>`;
    $('#shc').onclick=()=>{$('#layer').innerHTML=''};$('#veil').onclick=ev=>{if(ev.target.id==='veil')$('#layer').innerHTML=''}};
  const fallback=()=>{
    $('#layer').innerHTML=`<div class="veil" id="veil"><div class="sheet" role="dialog" aria-label="Bestand klaar"><h2>Bestand klaar</h2><p class="hint">${esc(name)}</p><p class="hint">Kies in het volgende scherm Mail, Outlook of Bewaar in Bestanden.</p><button class="btn" id="shr">Delen via mail</button><button class="btn ghost" id="shd">Bewaar op telefoon</button><button class="btn ghost" id="shc">Sluiten</button></div></div>`;
    const close=()=>{$('#layer').innerHTML=''};
    $('#shc').onclick=close;$('#veil').onclick=ev=>{if(ev.target.id==='veil')close()};
    $('#shd').onclick=download;
    $('#shr').onclick=()=>{
      if(!can){download();return}
      navigator.share(data).then(()=>{close();toast(okMsg)}).catch(e=>{if(e&&e.name==='AbortError')return;download()});
    };
  };
  if(isAndroid||!can){download();return}
  try{await navigator.share(data);$('#layer').innerHTML='';toast(okMsg)}
  catch(e){if(e&&e.name==='AbortError')return;fallback()}
}/*SAVE-END*/
async function exportXlsx(){

  if(!S.name)toast('Tip: vul je naam in via ⚙, dan staat die in de Excel.');
  const n=daysIn(Y,M),maand=MAANDEN[M][0].toUpperCase()+MAANDEN[M].slice(1);

  ws.columns=[{width:27.71},{width:9.57},{width:9.14},{width:9.14},{width:9.14},{width:9.14},{width:11.71},{width:45.14}];
  const LIGHT={name:'Calibri Light',size:11},CAL={name:'Calibri',size:11};

  const bd=(l,r,t,b)=>({left:l?{style:l}:undefined,right:r?{style:r}:undefined,top:t?{style:t}:undefined,bottom:b?{style:b}:undefined});

  ws.getCell('B1').value=S.name||'';ws.getCell('B2').value=maand;ws.getCell('B3').value=Y;
  ['A1','A2','A3','B1','B2','B3'].forEach(a=>{ws.getCell(a).font=LIGHT;ws.getCell(a).alignment={horizontal:'left'}});
  ws.getCell('B1').fill=GREEN;
  for(let r=1;r<=3;r++){
    ws.getCell(1+r-1,1).border=bd('medium','thin',r===1?'medium':'thin',r===3?'medium':'thin');
    for(let c=2;c<=5;c++)ws.getCell(r,c).border=bd(c===2?'thin':null,c===5?'medium':null,r===1?'medium':'thin',r===3?'medium':'thin');
  }
  const help=['15 minuten = 0,25 minuten','30 minuten = 0,50 minuten','45 minuten = 0,75 minuten'];
  help.forEach((t,i)=>{const c=ws.getCell(i+1,8);c.value=t;c.font=LIGHT;c.alignment={horizontal:'center'};c.border=bd('thin','medium',i===0?'medium':'thin',i===2?'medium':'thin')});
  // logo
  const img=wb.addImage({base64:LOGO,extension:'jpeg'});
  ws.addImage(img,{tl:{col:5.08,row:0.1},ext:{width:130,height:42}});
  // kolomkoppen rij 5
  const a5=ws.getCell('A5');a5.value={formula:'B2',result:maand};a5.font={...LIGHT,bold:true};a5.fill=YEL;a5.alignment={horizontal:'left'};a5.border=bd('medium','thin','medium',null);
  ['Starttijd','Eindtijd','Subtotaal','Pauze','Totaal','Reistijd','Bijzonderheden'].forEach((t,i)=>{const c=ws.getCell(5,i+2);c.value=t;c.font={...CAL,bold:true};c.alignment={horizontal:'center'};c.border=bd('thin',i===6?'medium':'thin','medium',null)});
  // dagen
  let sD=0,sP=0,sF=0,sG=0;
  for(let d=1;d<=n;d++){
    const r=5+d,e=S.entries[key(Y,M,d)],c=calc(e),dow=new Date(Y,M,d).getDay(),bot=(dow===6||d===n)?'medium':'thin',top=d===1?'medium':'thin';
    const a=ws.getCell(r,1);a.value=new Date(Date.UTC(Y,M,d));a.numFmt='[$-F800]dddd\\,\\ mmmm\\ dd\\,\\ yyyy';a.font=LIGHT;a.alignment={horizontal:'left'};a.border=bd('medium','thin',top,bot);
    const vals={2:c.s,3:c.e,5:e&&+e.p?c.p:null,7:e&&+e.t?c.t:null,8:e&&e.n?e.n:null};
    for(let col=2;col<=8;col++){
      const cell=ws.getCell(r,col);cell.font=CAL;cell.alignment={horizontal:'center'};cell.numFmt='0.00';cell.border=bd('thin',col===8?'medium':'thin',top,bot);
      if(col===4){cell.value={formula:`C${r}-B${r}`,result:c.sub}}
      else if(col===6){cell.value={formula:`D${r}-E${r}`,result:c.tot}}
      else{cell.fill=GREEN;if(vals[col]!==null&&vals[col]!==undefined)cell.value=vals[col]}
    }
    ws.getCell(r,8).numFmt='General';
    sD+=c.sub;sP+=c.p;sF+=c.tot;sG+=c.t;
  }
  // totaalrij
  const tr=6+n;ws.mergeCells(`A${tr}:C${tr}`);
  const ta=ws.getCell(tr,1);ta.value='Totaal';ta.font={...CAL,bold:true};ta.alignment={horizontal:'left'};
  for(let col=1;col<=8;col++)ws.getCell(tr,col).border=bd(col===1?'medium':(col>=4?'thin':null),col===8?'medium':null,null,'medium');
  [[4,'D',sD],[5,'E',sP],[6,'F',sF],[7,'G',sG]].forEach(([col,L,v])=>{const c=ws.getCell(tr,col);c.value={formula:`SUM(${L}6:${L}${tr-1})`,result:r2(v)};c.font={...CAL,bold:true};c.numFmt='0.00';c.alignment={horizontal:'center'}});
  const buf=await wb.xlsx.writeBuffer();
  const fname=`Urenregistratie_${maand}_${Y}.xlsx`;
  const due=monthTotals().due;
  const xblob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  await archSave(Y,M,fname,xblob);
  await offerFile(fname,xblob,'Excel opgeslagen'+(due?` · let op: ${due} geplande ${due===1?'dag is':'dagen zijn'} niet bevestigd en ${due===1?'staat':'staan'} er niet in`:''),`Urenregistratie ${maand} ${Y}${S.name?' – '+S.name:''}`);
}
render();
const autoRef=()=>{if(window.STANDALONE&&S.feed&&(!S.feedAt||Date.now()-S.feedAt>3*3600e3))refreshPlan(true)};
if(window.STANDALONE&&!S.onboarded&&!(S.name&&S.feed))openWelcome();else autoRef();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')autoRef()});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
