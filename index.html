<style>
/* Layout: één kolom, maandoverzicht bovenaan, dagenlijst, vaste exportknop onderaan; dag bewerken in een bladwijzer-sheet */
:root{
  --bg:#F4F4F5; --page:#E6E6E8; --edge:#C2C2C7; --surface:#FFFFFF; --fg:#2B2B2D; --muted:#66666C; --line:#E1E1E4;
  --accent:#D7001A; --accent-ink:#FFFFFF; --soft:#FBE4E7; --sun:#FDE8CF; --sun-ink:#6A3300; --danger:#B00016; --ok:#2E8B3E; --ok-ink:#FFFFFF; --logo-bg:#FFFFFF; --action:#F07800; --action-ink:#2B2B2D;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --display:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1C1E; --page:#0F0F10; --edge:#48484D; --surface:#1F1F22; --fg:#EDEDEF; --muted:#A2A2A8; --line:#333337;
  --accent:#E3263A; --accent-ink:#FFFFFF; --soft:#3A1A1F; --sun:#3E2A13; --sun-ink:#FFC98A; --danger:#FF8A95; --ok:#4CC26A; --ok-ink:#0B1F10; --logo-bg:#FFFFFF; --action:#FF8E1F; --action-ink:#1C1000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1C1E; --page:#0F0F10; --edge:#48484D; --surface:#1F1F22; --fg:#EDEDEF; --muted:#A2A2A8; --line:#333337;
  --accent:#E3263A; --accent-ink:#FFFFFF; --soft:#3A1A1F; --sun:#3E2A13; --sun-ink:#FFC98A; --danger:#FF8A95; --ok:#4CC26A; --ok-ink:#0B1F10; --logo-bg:#FFFFFF; --action:#FF8E1F; --action-ink:#1C1000; color-scheme:dark}
*{box-sizing:border-box}
html,body,button,input,textarea,label,a{touch-action:manipulation}
body{background:var(--page);color:var(--fg);font:15px/1.4 var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 76px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month{display:flex;align-items:center;gap:4px;min-width:0}
.month h1{font:700 22px/1.1 var(--display);margin:0;min-width:0;text-transform:capitalize}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px;flex:none}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stat small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.stat b{font:700 24px/1.2 var(--display);font-variant-numeric:tabular-nums}
.today{background:var(--sun);color:var(--sun-ink);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.today p{margin:0;min-width:0}.today strong{display:block;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--action);background:var(--action);color:var(--action-ink);font-weight:700;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.warn{background:transparent;color:var(--danger);border-color:var(--line)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:52px 1fr auto 26px;align-items:center;gap:10px;min-height:56px;padding:6px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row.we{background:color-mix(in srgb,var(--line) 35%,transparent)}
.row.sat{border-bottom:2px solid var(--fg)}
.row.now{box-shadow:inset 4px 0 0 var(--accent)}
.d{display:flex;flex-direction:column;line-height:1.1}.d b{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums}.d span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mid{min-width:0;font-size:14px;font-variant-numeric:tabular-nums}.mid i{display:block;font-style:normal;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted)}
.tot{font:700 17px var(--display);font-variant-numeric:tabular-nums;text-align:right}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--page) 28%);z-index:5}
.bar .btn{display:block;width:100%;max-width:560px;margin:0 auto;min-height:52px;font-size:16px}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font:700 20px var(--display)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);min-width:0}
input[type=time],input[type=number],input[type=text],input[type=email],textarea{font:16px var(--font);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;width:100%;min-width:0;text-transform:none;letter-spacing:0}
textarea{resize:vertical;min-height:70px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--bg)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sum{background:var(--soft);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;font-weight:600;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px}.actions .btn{flex:1}
.toggle{flex-direction:row;align-items:center;justify-content:space-between;text-transform:none;letter-spacing:0;font-size:15px;color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(68px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;max-width:90%;text-align:center}
.hint{color:var(--muted);font-size:13px;margin:0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.row.pend .mid,.row.pend .tot{color:var(--muted)}
.tag{display:inline-block;background:var(--sun);color:var(--sun-ink);font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px;margin-right:6px;text-transform:uppercase;letter-spacing:.05em}
.note{background:var(--sun);color:var(--sun-ink);border-radius:12px;padding:10px 14px;font-size:14px}
.tag.open{background:var(--line);color:var(--fg)}
.tag.vrij{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.ob.vrij{color:var(--ok)}
.vrijbox{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;margin:4px 0 12px}
.vrijbox>span{display:block;font-weight:700}
.vrijbox>p{margin:2px 0 10px;color:var(--muted);font-size:13px}
.vrijbox .chip[aria-pressed=true]{background:color-mix(in srgb,var(--ok) 16%,var(--bg));border-color:var(--ok);color:var(--ok);font-weight:700}
.vrijnote b{color:var(--ok)}
.note .chip{color:var(--fg)}
.actions .btn{padding:0 8px}
.sheet.split{padding:0;gap:0;overflow:hidden}
.sbody{overflow:auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 8px;display:flex;flex-direction:column;gap:14px;min-height:0}
.sfoot{padding:10px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.today .btn{white-space:nowrap;flex:none}
.ok{width:24px;height:24px;border-radius:50%;background:var(--ok);color:var(--ok-ink);display:grid;place-items:center}
.stat.main{grid-column:1/-1}
.stat.main em{display:block;font-style:normal;font-size:13px;opacity:.9;font-variant-numeric:tabular-nums}
.tot small{display:block;font:500 11px var(--font);color:var(--muted)}
.sum2{background:var(--soft);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.sum2 div{display:flex;justify-content:space-between}
.sum2 .grand{font-weight:700;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.note .nh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.note .nl{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.note .nh b{font:700 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.note .tags{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.note .tags em{font-style:normal;font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;background:color-mix(in srgb,var(--sun-ink) 14%,transparent)}
.blocks{list-style:none;margin:10px 0 0;padding:10px 0 0;border-top:1px solid color-mix(in srgb,var(--sun-ink) 25%,transparent);display:grid;gap:8px}
.blocks li{display:grid;grid-template-columns:96px 1fr;gap:8px}
.blocks .bt{font-variant-numeric:tabular-nums;font-weight:600}
.blocks .bn{min-width:0;overflow-wrap:anywhere}
.blocks .bn i{display:block;font-style:normal;font-size:12px;opacity:.8}
.note .adv{margin:10px 0 0;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--sun-ink) 25%,transparent)}

.sheet{text-align:left}
.row.wend{border-bottom:2px solid var(--fg)}
.week{display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:center;padding:8px 14px;background:var(--soft);border-bottom:2px solid var(--fg);font-variant-numeric:tabular-nums}
.week .wl b{display:block;font:700 14px var(--display)}
.week i{display:block;font-style:normal;font-size:11px;color:var(--muted);font-weight:500;font-family:var(--font)}
.week .wc{text-align:right;font:700 17px var(--display)}
.week .wc small{display:block;font:500 11px var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.week{border-left:4px solid var(--accent);padding:10px 14px 10px 12px;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.week .wl b{font-size:16px}
.week .wc{font-size:20px}

.week .wn{color:var(--muted);font-weight:600;font-size:14px;text-align:right}
.weeks{display:flex;flex-direction:column;gap:14px}
.wkcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.wkcard .week{border-top:0}
.wkcard{border-color:var(--edge);box-shadow:0 2px 6px rgba(0,0,0,.14)}
.stat,.today{border-color:var(--edge)}
.stat:not(.main){box-shadow:0 1px 3px rgba(0,0,0,.1)}
.icon,.btn.ghost{border-color:var(--edge)}
.link{background:none;border:0;color:var(--danger);text-decoration:underline;min-height:44px;padding:0;align-self:center;font:inherit}
.bk{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.bk p{margin:0}
.filebtn{display:grid;place-items:center;position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:34px;width:auto;background:var(--logo-bg);border-radius:8px;padding:4px 8px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.brand span{font:600 13px var(--font);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.btn.ghost,.btn.warn{box-shadow:none;font-weight:600}
.btn:active{transform:translateY(1px);box-shadow:none}
.hdr{background:var(--surface);border:1px solid var(--edge);border-radius:16px;box-shadow:0 2px 6px rgba(0,0,0,.12);padding:12px;display:flex;flex-direction:column;gap:12px}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:10px}

.hdr .mt{text-align:center;min-width:0}

.hdr .mt h1{margin:0;font:700 22px/1.15 var(--display);text-transform:capitalize}
.sum-card{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px 16px;box-shadow:0 2px 6px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:12px;font-variant-numeric:tabular-nums}
.sum-card small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;opacity:.85;font-weight:600}

.sc-parts{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;border-top:1px solid color-mix(in srgb,var(--accent-ink) 30%,transparent);padding-top:10px}

.tcard{flex-direction:column;align-items:stretch;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--edge)}

.mini{position:fixed;left:0;right:0;top:0;z-index:9;padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--edge);box-shadow:0 2px 8px rgba(0,0,0,.15);transform:translateY(-110%);transition:transform .2s ease}

function applyTheme(){const t=themeOf(),r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);
  const dk=t==='dark'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.querySelectorAll('meta[name=theme-color]').forEach(m=>{if(t==='auto'){m.setAttribute('content',m.getAttribute('media').includes('dark')?'#0F0F10':'#E6E6E8')}else m.setAttribute('content',dk?'#0F0F10':'#E6E6E8')})}

function importIcs(txt,quiet){
  if(!txt.includes('BEGIN:VCALENDAR')){toast('Kies het .ics-bestand of plak de tekst die begint met BEGIN:VCALENDAR');return false}
  const pl=parseIcs(txt),ks=Object.keys(pl).sort();
  if(!ks.length){toast('Geen diensten gevonden in dit bestand');return false}
  for(const k of Object.keys(S.plans))if(k>=ks[0]&&k<=ks[ks.length-1])delete S.plans[k];
  Object.assign(S.plans,pl);save();if(!quiet)$('#layer').innerHTML='';render();if(!quiet)toast(`${ks.length} dagen met planning ingeladen`);return ks.length;
}
async function refreshPlan(auto){
  if(!window.STANDALONE||!S.feed||refreshPlan.busy)return false;
  refreshPlan.busy=true;const rb=$('#rfr');if(rb)rb.classList.add('spin');
  try{
    const link=S.feed.trim().replace(/^webcal:/i,'https:');
    const viaProxy=window.PROXY&&!/\.workers\.dev/i.test(link);
    const r=await fetch(viaProxy?window.PROXY+'?url='+encodeURIComponent(link):link,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    const txt=await r.text();if(!txt.includes('BEGIN:VCALENDAR'))throw new Error('geen agenda');
    const n=importIcs(txt,true);if(!n)throw new Error('leeg');
    S.feedAt=Date.now();S.feedErr='';save();render();toast(auto?`Planning bijgewerkt (${n} dagen)`:`Actuele planning opgehaald: ${n} dagen`);return true;
  }catch(e){
    const first=!S.feedErr;S.feedErr=String(e&&e.message||e);save();
    if(!auto||first)toast('Planning ophalen lukte niet. Kijk bij Menu → Planning of je link klopt.');
    return false;
  }finally{refreshPlan.busy=false;const b=$('#rfr');if(b)b.classList.remove('spin')}
}

const AKEY='uren-archief';
const archGet=()=>{try{return JSON.parse(localStorage.getItem(AKEY)||'{}')}catch(e){return{}}};
const archPut=a=>{try{localStorage.setItem(AKEY,JSON.stringify(a));return true}catch(e){return false}};
const archCount=()=>Object.keys(archGet()).length;
const b64=blob=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(blob)});
const unb64=(s,type)=>{const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type})};
async function archSave(y,m,name,blob){try{const a=archGet();a[`${y}-${pad(m+1)}`]={name,at:Date.now(),data:await b64(blob)};if(!archPut(a))toast('Archief is vol: de Excel is niet bewaard')}catch(e){}}
function openArchive(){

  $('#layer').innerHTML=sheetBack('Archief',`<p class="hint">Elke Excel die je maakt, wordt hier per maand bewaard. Maak je een maand opnieuw, dan wordt de oude versie vervangen.</p>${ks.length?`<div class="alist">${rows}</div>`:'<p class="hint"><b>Nog leeg.</b> Zodra je met Maak Excel een maand verstuurt, staat hij hier.</p>'}`);
  wireBack();
  document.querySelectorAll('[data-ar]').forEach(bt=>bt.onclick=()=>{const v=archGet()[bt.dataset.ar];if(v)offerFile(v.name,unb64(v.data,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'),'Excel gedeeld',v.name.replace('.xlsx','').replace(/_/g,' '))});
}

function openBackup(){
  $('#layer').innerHTML=sheetBack('Back-up',`<p class="hint">Bewaar al je uren, instellingen en het Excel-archief in een bestand. Daarmee zet je ze terug op een nieuw toestel. In het bestand staat ook je planning-link: deel het niet met anderen.</p>
  <button class="btn" id="bexp">Back-up maken</button><label class="btn ghost filebtn">Back-up terugzetten<input type="file" id="bimp" accept=".json,application/json"></label>
  <div id="bconf" class="note" hidden><b>Let op:</b> dit vervangt alle uren en instellingen op dit toestel door die uit de back-up.<div class="actions" style="margin-top:10px"><button class="btn ghost" id="bno">Annuleer</button><button class="btn" id="byes">Terugzetten</button></div></div>`);
  wireBack();
  $('#bexp').onclick=()=>{const d=new Date();offerFile(`JobTijd-backup-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`,new Blob([JSON.stringify(Object.assign({},S,{archief:archGet()}))],{type:'application/json'}),'Back-up gemaakt')};
  let pending=null;
  $('#bimp').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||typeof d.entries!=='object')throw 0;pending=d;$('#bconf').hidden=false}catch(e){toast('Dit is geen geldig back-upbestand')}ev.target.value=''};
  $('#bno').onclick=()=>{pending=null;$('#bconf').hidden=true};
  $('#byes').onclick=()=>{if(!pending)return;if(pending.archief){const a=Object.assign(archGet(),pending.archief);archPut(a)}const p2=Object.assign({},pending);delete p2.archief;S=Object.assign({name:'',round:true,deduct:true,entries:{},plans:{},feed:''},p2);S.tUnit=S.tUnit||'h';S.onboarded=true;save();$('#layer').innerHTML='';render();toast('Back-up teruggezet')};
}
const FAQ=[

const STOP=new Set(['niet','mijn','ik','de','het','een','wat','hoe','wie','doe','dat','die','is','en','of','in','op','van','met','voor','kan','moet','wil','ook','nog','er','te','je','jij','me','werkt','uren','app']);
function openHelp(q){
  $('#layer').innerHTML=sheetBack('Help en ondersteuning',`<div class="supcard"><span><b>Idee, vraag of probleem?</b><small>Stuur een bericht naar de beheerder van de app.</small></span><button type="button" class="btn" id="hsup">Stuur een bericht</button></div><label class="srch"><span class="sr">Zoeken</span><input type="search" id="hq" placeholder="Zoek, bijvoorbeeld: reistijd" value="${esc(q||'')}" autocomplete="off"></label><div id="hl" class="faq"></div>`);
  wireBack();
  $('#hsup').onclick=openSupport;
  const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const draw=()=>{const w=norm($('#hq').value).split(/\s+/).filter(Boolean);
    const stem=x=>x.length>5?x.slice(0,x.length-2):x;
    const hits=w.length?FAQ.map(f=>{const t=norm(f[0]+' '+f[1]+' '+(f[2]||'')),tq=norm(f[0]+' '+(f[2]||''));let s=0;w.forEach(x=>{if((x.length<3&&!/\d/.test(x))||STOP.has(x))return;if(t.includes(stem(x)))s+=(tq.includes(stem(x))?2:1)+(norm(f[2]||'').includes(stem(x))?1:0)});return[f,s]}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]):FAQ;
    $('#hl').innerHTML=hits.length?hits.map(([a,b],i)=>`<details${w.length&&i===0?' open':''}><summary>${esc(a)}</summary><p>${esc(b)}</p></details>`).join(''):'<p class="hint">Geen antwoord gevonden. Probeer een ander woord, of tik bovenaan op Stuur een bericht.</p>'};
  $('#hq').oninput=draw;draw();
}

document.addEventListener('click',ev=>{
  if(Date.now()-swipeAt<450)return;const t=ev.target.closest('[data-nav],[data-day],[data-q],[data-cal],[data-view],#set,#plan,#export,#rfr,#menu');if(!t)return;
  if(t.dataset.nav){M+=+t.dataset.nav;if(M<0){M=11;Y--}if(M>11){M=0;Y++}render()}
  else if(t.dataset.day)openDay(t.dataset.day);
  else if(t.dataset.cal)openCal();
  else if(t.dataset.view){S.view=t.dataset.view;save();render();if(Y===now.getFullYear()&&M===now.getMonth())scrollToday()}
  else if(t.dataset.q==='confirmall'){const td=key(now.getFullYear(),now.getMonth(),now.getDate());let c=0;for(const k in S.plans)if(k<=td&&!S.entries[k]&&S.plans[k].auto&&!S.plans[k].q){setEntry(k,{s:S.plans[k].s,e:S.plans[k].e,p:S.plans[k].p});c++}render();toast(`${c} ${c===1?'dag':'dagen'} bevestigd`)}
  else if(t.dataset.q==='vrijall'){const ks=openDays();ks.forEach(k=>{S.entries[k]={vrij:true,s:'',e:'',p:0,t:0,n:''}});save();render();toast(`${ks.length} ${ks.length===1?'dag':'dagen'} als vrij opgeslagen${CT()?` · telt als ${hh(CT()/CD())} per dag`:''}`)}
  else if(t.dataset.q==='offall'){const ks=openDays();ks.forEach(k=>{S.entries[k]={off:true,s:'',e:'',p:0,t:0,n:''}});save();render();toast(`${ks.length} ${ks.length===1?'dag':'dagen'} als niet gewerkt bevestigd`)}
  else if(t.dataset.q){const k=key(now.getFullYear(),now.getMonth(),now.getDate());setEntry(k,t.dataset.q==='start'?{s:roundT(new Date())}:{e:roundT(new Date())});render();toast(t.dataset.q==='start'?'Gestart':'Gestopt')}
  else if(t.id==='set')openSettings();
  else if(t.id==='menu')openMenu();
  else if(t.id==='plan')openPlan();
  else if(t.id==='rfr')refreshPlan(false);
  else if(t.id==='export')exportXlsx();
});

/*SAVE*/async function offerFile(name,blob,okMsg,text){
  const file=new File([blob],name,{type:blob.type||'application/octet-stream'});
  let can=false;try{can=!!(navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
  const data={files:[file]};if(text)data.text=text;
  const isAndroid=/Android/i.test(navigator.userAgent);
  const download=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},8000);
    $('#layer').innerHTML=`<div class="veil" id="veil"><div class="sheet" role="dialog" aria-label="Bestand opgeslagen"><h2>Bestand opgeslagen</h2><p class="hint"><b>${esc(name)}</b> staat in je map Downloads.</p>
    <label>Versturen naar<input type="email" id="dm" inputmode="email" autocapitalize="off" autocorrect="off" placeholder="naam@jobtrans.nl" value="${esc(S.mailTo||'')}"></label>
    <button class="btn" id="dmail">Open mail</button>
    <ol class="howto"><li>Tik op <b>Open mail</b>. Je mail-app opent met het adres en het onderwerp al ingevuld.</li><li>Tik op de <b>paperclip</b> en kies <b>${esc(name)}</b> uit Downloads.</li><li>Tik op <b>Verzenden</b>.</li></ol>
    <button class="btn ghost" id="shc">Sluiten</button></div></div>`;
    $('#shc').onclick=()=>{$('#layer').innerHTML=''};$('#veil').onclick=ev=>{if(ev.target.id==='veil')$('#layer').innerHTML=''};
    $('#dmail').onclick=()=>{const m=$('#dm').value.trim();if(m&&!okMail(m)){toast('Controleer het e-mailadres: er ontbreekt iets');return}
      if(m!==(S.mailTo||'')){S.mailTo=m;save()}
      const l=document.createElement('a');l.href=mailHref(m,name);document.body.appendChild(l);l.click();l.remove()}};
  const fallback=()=>{
    $('#layer').innerHTML=`<div class="veil" id="veil"><div class="sheet" role="dialog" aria-label="Bestand klaar"><h2>Bestand klaar</h2><p class="hint">${esc(name)}</p><p class="hint">Kies in het volgende scherm Mail, Outlook of Bewaar in Bestanden.</p><button class="btn" id="shr">Delen via mail</button><button class="btn ghost" id="shd">Bewaar op telefoon</button><button class="btn ghost" id="shc">Sluiten</button></div></div>`;
    const close=()=>{$('#layer').innerHTML=''};
    $('#shc').onclick=close;$('#veil').onclick=ev=>{if(ev.target.id==='veil')close()};
    $('#shd').onclick=download;
    $('#shr').onclick=()=>{
      if(!can){download();return}
      navigator.share(data).then(()=>{close();toast(okMsg)}).catch(e=>{if(e&&e.name==='AbortError')return;download()});
    };
  };
  if(isAndroid||!can){download();return}
  const to=(S.mailTo||'').trim();
  if(to){
    $('#layer').innerHTML=`<div class="veil" id="veil"><div class="sheet" role="dialog" aria-label="Excel versturen"><h2>Excel versturen</h2>
    <p class="hint">Naar: <b>${esc(to)}</b></p>
    <ol class="howto"><li>Tik op <b>Verder naar mail</b> en kies <b>Mail</b> of <b>Outlook</b>. De Excel zit er al bij.</li><li>Het adres is gekopieerd. Tik in je mail in het veld <b>Aan</b> en kies <b>Plak</b>.</li><li>Tik op <b>Verzenden</b>.</li></ol>
    <p class="hint">Een iPhone laat een app het adres niet zelf invullen via het deelmenu. Daarom plak je het even.</p>
    <button class="btn" id="go">Verder naar mail</button><button class="btn ghost" id="shc">Annuleer</button></div></div>`;
    const close=()=>{$('#layer').innerHTML=''};
    $('#shc').onclick=close;$('#veil').onclick=ev=>{if(ev.target.id==='veil')close()};
    $('#go').onclick=()=>{try{navigator.clipboard&&navigator.clipboard.writeText(to).catch(()=>{})}catch(e){}
      navigator.share(data).then(()=>{close();toast(okMsg)}).catch(e=>{if(e&&e.name==='AbortError')return;fallback()})};
    return}
  try{await navigator.share(data);$('#layer').innerHTML='';toast(okMsg)}
  catch(e){if(e&&e.name==='AbortError')return;fallback()}
}/*SAVE-END*/
async function exportXlsx(){
  if(!window.ExcelJS){toast('Excel-bibliotheek kon niet laden. Controleer je verbinding.');return}
  if(!S.name)toast('Tip: vul je naam in via ⚙, dan staat die in de Excel.');
